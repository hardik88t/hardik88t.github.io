<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hardik Thanth, full-stack developer at Avinya IT. Production web and native apps built with a fleet of AI agents." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EDF1EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Restore the viewer's explicit theme choice before first paint (falls back to the OS setting).
      try {
        var t = localStorage.getItem('ht-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>Hardik Thanth | Full-stack developer and agent-driven studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
